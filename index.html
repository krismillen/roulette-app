<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>European Roulette Prototype</title>
  <style>
    :root {
      --bg-color: #0d1b12;
      --felt-green: #155d3b;
      --felt-border: #1e8252;
      --gold: #d4af37;
      --red: #d32f2f;
      --black: #212121;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0;
      padding: 10px;
      box-sizing: border-box;
    }

    h1 {
      color: var(--gold);
      margin: 5px 0 10px 0;
      text-transform: uppercase;
      letter-spacing: 1px;
      text-align: center;
      font-size: 1.5rem;
    }

    #game-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      max-width: 100%;
      width: 100%;
    }

    /* Wheel Styling */
    #wheel-canvas {
      background: transparent;
      max-width: 260px;
      height: auto;
    }

    /* Dashboard Layout Optimized for Mobile */
    .dashboard {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
      background: rgba(0, 0, 0, 0.5);
      padding: 10px 15px;
      border-radius: 8px;
      border: 1px solid var(--gold);
      box-sizing: border-box;
      text-align: center;
    }

    .stats-row {
      display: flex;
      justify-content: space-between;
      font-size: 1.1rem;
      font-weight: bold;
    }

    .status-msg {
      font-size: 1rem;
      color: var(--gold);
      font-weight: bold;
      min-height: 1.2em;
    }

    .stat span { color: var(--gold); }

    /* Betting Board Container with Horizontal Scroll */
    .board-wrapper {
      width: 100%;
      overflow-x: auto;
      padding-bottom: 5px;
      -webkit-overflow-scrolling: touch;
    }

    /* Betting Board Grid */
    .board {
      display: grid;
      grid-template-columns: 40px repeat(12, 45px) 40px;
      grid-template-rows: repeat(3, 40px) 38px 38px;
      gap: 3px;
      background-color: var(--felt-border);
      padding: 8px;
      border-radius: 8px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.5);
      width: max-content;
      margin: 0 auto;
    }

    .cell {
      background-color: var(--felt-green);
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: bold;
      cursor: pointer;
      user-select: none;
      position: relative;
      border-radius: 3px;
      font-size: 0.85rem;
      transition: background 0.2s, transform 0.1s;
    }

    .cell:active {
      filter: brightness(1.3);
      transform: scale(0.96);
    }

    .cell.red { background-color: var(--red); }
    .cell.black { background-color: var(--black); }
    .cell.zero { grid-row: 1 / span 3; grid-column: 1; background-color: #2e7d32; }

    /* Outside Bets Spans */
    .doz-1 { grid-row: 4; grid-column: 2 / span 4; }
    .doz-2 { grid-row: 4; grid-column: 6 / span 4; }
    .doz-3 { grid-row: 4; grid-column: 10 / span 4; }

    .low { grid-row: 5; grid-column: 2 / span 2; }
    .even { grid-row: 5; grid-column: 4 / span 2; }
    .red-bet { grid-row: 5; grid-column: 6 / span 2; background-color: var(--red); }
    .black-bet { grid-row: 5; grid-column: 8 / span 2; background-color: var(--black); }
    .odd { grid-row: 5; grid-column: 10 / span 2; }
    .high { grid-row: 5; grid-column: 12 / span 2; }

    .col-1 { grid-row: 1; grid-column: 14; }
    .col-2 { grid-row: 2; grid-column: 14; }
    .col-3 { grid-row: 3; grid-column: 14; }

    /* Chip Indicator */
    .chip {
      position: absolute;
      width: 22px;
      height: 22px;
      background: var(--gold);
      color: black;
      border-radius: 50%;
      border: 2px dashed black;
      font-size: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      box-shadow: 0 2px 5px rgba(0,0,0,0.5);
    }

    /* Controls */
    .controls {
      display: flex;
      gap: 12px;
      width: 100%;
      justify-content: center;
    }

    button {
      background: linear-gradient(180deg, #d4af37 0%, #aa820a 100%);
      border: none;
      padding: 12px 20px;
      font-size: 1rem;
      font-weight: bold;
      color: #000;
      border-radius: 6px;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
      flex: 1;
      max-width: 180px;
    }

    button:disabled { background: #555; color: #888; cursor: not-allowed; }
  </style>
</head>
<body>

  <h1>European Roulette</h1>

  <div id="game-container">
    <canvas id="wheel-canvas" width="300" height="300"></canvas>

    <div class="dashboard">
      <div class="stats-row">
        <div class="stat">Bankroll: $<span id="balance">1000</span></div>
        <div class="stat">Total Bet: $<span id="total-bet">0</span></div>
      </div>
      <div class="status-msg" id="status">Place your bets!</div>
    </div>

    <div class="board-wrapper">
      <div class="board" id="board">
        <div class="cell zero" data-type="straight" data-val="0">0</div>
      </div>
    </div>

    <div class="controls">
      <button id="spin-btn">SPIN WHEEL</button>
      <button id="clear-btn" style="background: #e53935; color: white;">Clear Bets</button>
    </div>
  </div>

  <script>
    const POCKETS = [
      0, 32, 15, 19, 4, 21, 2, 25, 17, 34, 6, 27, 13, 36, 11, 30, 8, 23, 10,
      5, 24, 16, 33, 1, 20, 14, 31, 9, 22, 18, 29, 7, 28, 12, 35, 3, 26
    ];
    const REDS = [1, 3, 5, 7, 9, 12, 14, 16, 18, 19, 21, 23, 25, 27, 30, 32, 34, 36];

    let bankroll = 1000;
    let activeBets = {};
    let isSpinning = false;
    let wheelAngle = 0;

    const board = document.getElementById('board');

    for (let c = 1; c <= 12; c++) {
      for (let r = 3; r >= 1; r--) {
        const num = (c - 1) * 3 + (4 - r);
        const cell = document.createElement('div');
        const isRed = REDS.includes(num);
        cell.className = `cell ${isRed ? 'red' : 'black'}`;
        cell.style.gridRow = r;
        cell.style.gridColumn = c + 1;
        cell.textContent = num;
        cell.dataset.type = 'straight';
        cell.dataset.val = num;
        board.appendChild(cell);
      }
    }

    const outsideBets = [
      { name: '1st 12', type: 'dozen', val: 1, class: 'doz-1' },
      { name: '2nd 12', type: 'dozen', val: 2, class: 'doz-2' },
      { name: '3rd 12', type: 'dozen', val: 3, class: 'doz-3' },
      { name: '1-18', type: 'highlow', val: 'low', class: 'low' },
      { name: 'EVEN', type: 'parity', val: 'even', class: 'even' },
      { name: 'RED', type: 'color', val: 'red', class: 'red-bet' },
      { name: 'BLACK', type: 'color', val: 'black', class: 'black-bet' },
      { name: 'ODD', type: 'parity', val: 'odd', class: 'odd' },
      { name: '19-36', type: 'highlow', val: 'high', class: 'high' },
      { name: '2:1', type: 'column', val: 3, class: 'col-1' },
      { name: '2:1', type: 'column', val: 2, class: 'col-2' },
      { name: '2:1', type: 'column', val: 1, class: 'col-3' }
    ];

    outsideBets.forEach(b => {
      const cell = document.createElement('div');
      cell.className = `cell ${b.class}`;
      cell.textContent = b.name;
      cell.dataset.type = b.type;
      cell.dataset.val = b.val;
      board.appendChild(cell);
    });

    board.addEventListener('click', (e) => {
      if (isSpinning) return;
      const cell = e.target.closest('.cell');
      if (!cell) return;

      const type = cell.dataset.type;
      const val = cell.dataset.val;
      const betKey = `${type}_${val}`;

      const CHIP_VALUE = 10;
      if (bankroll < CHIP_VALUE) {
        alert("Not enough chips!");
        return;
      }

      bankroll -= CHIP_VALUE;
      activeBets[betKey] = (activeBets[betKey] || 0) + CHIP_VALUE;
      
      updateUI();
      renderChip(cell, activeBets[betKey]);
    });

    function renderChip(cell, amount) {
      let chip = cell.querySelector('.chip');
      if (!chip) {
        chip = document.createElement('div');
        chip.className = 'chip';
        cell.appendChild(chip);
      }
      chip.textContent = `$${amount}`;
    }

    document.getElementById('clear-btn').addEventListener('click', () => {
      if (isSpinning) return;
      for (let key in activeBets) {
        bankroll += activeBets[key];
      }
      activeBets = {};
      document.querySelectorAll('.chip').forEach(c => c.remove());
      updateUI();
    });

    function updateUI() {
      document.getElementById('balance').textContent = bankroll;
      const totalBet = Object.values(activeBets).reduce((a, b) => a + b, 0);
      document.getElementById('total-bet').textContent = totalBet;
    }

    const canvas = document.getElementById('wheel-canvas');
    const ctx = canvas.getContext('2d');
    const centerX = canvas.width / 2;
    const centerY = canvas.height / 2;
    const radius = 130;

    function drawWheel() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const numPockets = POCKETS.length;
      const sliceAngle = (2 * Math.PI) / numPockets;

      for (let i = 0; i < numPockets; i++) {
        const num = POCKETS[i];
        const angle = wheelAngle + i * sliceAngle;

        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        ctx.arc(centerX, centerY, radius, angle, angle + sliceAngle);
        ctx.fillStyle = num === 0 ? '#2e7d32' : REDS.includes(num) ? '#d32f2f' : '#212121';
        ctx.fill();
        ctx.stroke();

        ctx.save();
        ctx.translate(centerX, centerY);
        ctx.rotate(angle + sliceAngle / 2);
        ctx.textAlign = "right";
        ctx.fillStyle = "#fff";
        ctx.font = "bold 12px sans-serif";
        ctx.fillText(num, radius - 10, 4);
        ctx.restore();
      }

      ctx.beginPath();
      ctx.arc(centerX, centerY, 30, 0, 2 * Math.PI);
      ctx.fillStyle = '#d4af37';
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(centerX, centerY - radius - 8);
      ctx.lineTo(centerX - 8, centerY - radius + 8);
      ctx.lineTo(centerX + 8, centerY - radius + 8);
      ctx.closePath();
      ctx.fillStyle = 'white';
      ctx.fill();
    }
    drawWheel();

    document.getElementById('spin-btn').addEventListener('click', () => {
      const totalBet = Object.values(activeBets).reduce((a, b) => a + b, 0);
      if (totalBet === 0) {
        alert("Place at least one bet first!");
        return;
      }

      isSpinning = true;
      document.getElementById('spin-btn').disabled = true;
      document.getElementById('status').textContent = "Spinning...";

      const winningIndex = Math.floor(Math.random() * POCKETS.length);
      const winningNumber = POCKETS[winningIndex];

      const sliceAngle = (2 * Math.PI) / POCKETS.length;
      const targetAngle = (3 * Math.PI / 2) - (winningIndex * sliceAngle) - (sliceAngle / 2);
      
      const extraSpins = 5 * 2 * Math.PI;
      const finalAngle = wheelAngle + extraSpins + (targetAngle - (wheelAngle % (2 * Math.PI)));

      let start = null;
      const duration = 4000;

      function animate(timestamp) {
        if (!start) start = timestamp;
        const progress = (timestamp - start) / duration;

        if (progress < 1) {
          const easeOut = 1 - Math.pow(1 - progress, 3);
          wheelAngle = wheelAngle + (finalAngle - wheelAngle) * (easeOut * 0.08);
          drawWheel();
          requestAnimationFrame(animate);
        } else {
          wheelAngle = finalAngle;
          drawWheel();
          evaluateResults(winningNumber);
        }
      }
      requestAnimationFrame(animate);
    });

    function evaluateResults(winNum) {
      let totalPayout = 0;
      const isRed = REDS.includes(winNum);

      for (let key in activeBets) {
        const [type, val] = key.split('_');
        const betAmount = activeBets[key];

        if (type === 'straight' && parseInt(val) === winNum) {
          totalPayout += betAmount * 36;
        } else if (type === 'color' && winNum !== 0) {
          if ((val === 'red' && isRed) || (val === 'black' && !isRed)) {
            totalPayout += betAmount * 2;
          }
        } else if (type === 'parity' && winNum !== 0) {
          if ((val === 'even' && winNum % 2 === 0) || (val === 'odd' && winNum % 2 !== 0)) {
            totalPayout += betAmount * 2;
          }
        } else if (type === 'highlow' && winNum !== 0) {
          if ((val === 'low' && winNum <= 18) || (val === 'high' && winNum >= 19)) {
            totalPayout += betAmount * 2;
          }
        } else if (type === 'dozen' && winNum !== 0) {
          const doz = parseInt(val);
          if ((doz === 1 && winNum <= 12) || 
              (doz === 2 && winNum >= 13 && winNum <= 24) || 
              (doz === 3 && winNum >= 25)) {
            totalPayout += betAmount * 3;
          }
        } else if (type === 'column' && winNum !== 0) {
          const col = parseInt(val);
          if ((winNum - col) % 3 === 0) {
            totalPayout += betAmount * 3;
          }
        }
      }

      bankroll += totalPayout;
      
      const colorText = winNum === 0 ? "GREEN" : isRed ? "RED" : "BLACK";
      document.getElementById('status').textContent = `Result: ${winNum} (${colorText}) | Won: $${totalPayout}`;
      
      activeBets = {};
      document.querySelectorAll('.chip').forEach(c => c.remove());
      updateUI();
      isSpinning = false;
      document.getElementById('spin-btn').disabled = false;
    }
  </script>
</body>
</html>
